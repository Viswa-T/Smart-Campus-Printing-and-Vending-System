server.port=${PORT:8080}

spring.application.name=xeroxgo-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xeroxgo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Application / Security Settings
xeroxgo.security.jwt-secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
xeroxgo.security.jwt-expiration-ms=86400000
xeroxgo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://xeroxgo.vercel.app}

# Pricing Defaults
xeroxgo.pricing.bw-price-per-page=1.00
xeroxgo.pricing.color-price-per-page=5.00
xeroxgo.pricing.double-side-discount-percentage=30.00

# Google OAuth client ID
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:590960486915-0hugrj58m6rvgdqom59a3q6g7k3bls7i.apps.googleusercontent.com}